[package]
name = "moham_sync"
version = "0.1.0"
description = "Database Synchronization Engine"
authors = ["you"]
edition = "2021"

[features]
default = ["desktop"]
desktop = ["tauri", "tauri-plugin-opener", "window-vibrancy"]
integration = []

[lib]
name = "moham_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
window-vibrancy = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "macros"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
